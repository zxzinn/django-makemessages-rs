name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Install Django
        run: |
          python -m venv tests/differential/.venv
          tests/differential/.venv/bin/pip install --quiet \
            'django>=5.0' django-extended-makemessages

      - name: Check formatting
        run: cargo fmt --check

      - name: Build
        run: cargo build --release

      - name: Unit tests
        run: cargo test --release

      - name: Differential tests against Django
        run: ./tests/differential/run.sh
